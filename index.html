<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>한국 가볼 만한 곳</title>
  <meta name="description" content="2026 한국의 월별 축제와 지역별 여행지를 한눈에" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="한국여행" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph (카카오톡·페이스북·슬랙 등 공유 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="한국 가볼 만한 곳" />
  <meta property="og:description" content="2026 한국의 월별 축제와 지역별 여행지를 한눈에. 전국 700+ 큐레이션." />
  <meta property="og:image" content="https://hhakimm.github.io/festivals-site/og-image.svg" />
  <meta property="og:url" content="https://hhakimm.github.io/festivals-site/" />
  <meta property="og:site_name" content="한국 가볼 만한 곳" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="한국 가볼 만한 곳" />
  <meta name="twitter:description" content="2026 한국의 월별 축제와 지역별 여행지" />
  <meta name="twitter:image" content="https://hhakimm.github.io/festivals-site/og-image.svg" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/leaflet/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/leaflet/markercluster/MarkerCluster.Default.css" />
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="vendor/leaflet/markercluster/leaflet.markercluster.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">한국 가볼 만한 곳</h1>
      <p class="site-subtitle">2026 월별 축제와 지역별 여행지를 한눈에</p>
      <nav class="tabs" role="tablist" aria-label="콘텐츠 종류">
        <button type="button" id="tab-festivals" class="tab is-active" role="tab" aria-selected="true" data-tab="festivals">2026 축제</button>
        <button type="button" id="tab-places" class="tab" role="tab" aria-selected="false" data-tab="places">여행지</button>
      </nav>
    </div>
  </header>

  <section class="filter-bar" aria-label="축제 필터">
    <div class="container">
      <div class="filter-group filter-group-search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search-input" class="search-input"
               placeholder="이름·지역으로 검색…" autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear" aria-label="검색 지우기" hidden>×</button>
      </div>
      <div class="filter-group" id="month-filter-group" role="group" aria-label="월 선택">
        <span class="filter-label">월</span>
        <div class="chip-group" id="month-chips">
          <button type="button" class="chip is-active" data-month="all">전체</button>
          <button type="button" class="chip" data-month="1">1월</button>
          <button type="button" class="chip" data-month="2">2월</button>
          <button type="button" class="chip" data-month="3">3월</button>
          <button type="button" class="chip" data-month="4">4월</button>
          <button type="button" class="chip" data-month="5">5월</button>
          <button type="button" class="chip" data-month="6">6월</button>
          <button type="button" class="chip" data-month="7">7월</button>
          <button type="button" class="chip" data-month="8">8월</button>
          <button type="button" class="chip" data-month="9">9월</button>
          <button type="button" class="chip" data-month="10">10월</button>
          <button type="button" class="chip" data-month="11">11월</button>
          <button type="button" class="chip" data-month="12">12월</button>
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="region-select">지역</label>
        <select id="region-select" class="select">
          <option value="all">전체</option>
          <option value="서울특별시">서울특별시</option>
          <option value="부산광역시">부산광역시</option>
          <option value="대구광역시">대구광역시</option>
          <option value="인천광역시">인천광역시</option>
          <option value="광주광역시">광주광역시</option>
          <option value="대전광역시">대전광역시</option>
          <option value="울산광역시">울산광역시</option>
          <option value="세종특별자치시">세종특별자치시</option>
          <option value="경기도">경기도</option>
          <option value="강원특별자치도">강원특별자치도</option>
          <option value="충청북도">충청북도</option>
          <option value="충청남도">충청남도</option>
          <option value="전북특별자치도">전북특별자치도</option>
          <option value="전라남도">전라남도</option>
          <option value="경상북도">경상북도</option>
          <option value="경상남도">경상남도</option>
          <option value="제주특별자치도">제주특별자치도</option>
        </select>
      </div>

      <div class="filter-group" id="category-filter-group" role="group" aria-label="카테고리 선택" hidden>
        <span class="filter-label">테마</span>
        <div class="chip-group" id="category-chips">
          <button type="button" class="chip is-active" data-category="all">전체</button>
          <button type="button" class="chip" data-category="자연">자연</button>
          <button type="button" class="chip" data-category="역사">역사</button>
          <button type="button" class="chip" data-category="휴양">휴양</button>
          <button type="button" class="chip" data-category="체험">체험</button>
          <button type="button" class="chip" data-category="건축">건축</button>
        </div>
      </div>

      <div class="filter-meta">
        <div class="filter-meta-left">
          <span id="result-count" class="result-count">총 0개의 축제</span>
          <button type="button" id="favorites-toggle" class="meta-toggle" aria-pressed="false">
            <span class="meta-toggle-icon">♡</span> 즐겨찾기
          </button>
          <button type="button" id="nearby-toggle" class="meta-toggle" aria-pressed="false">
            <span class="meta-toggle-icon">📍</span> 내 주변
          </button>
          <select id="sort-select" class="sort-select" aria-label="정렬 기준">
            <option value="default">기본순</option>
            <option value="name">이름순</option>
            <option value="date">시작일순</option>
          </select>
        </div>
        <div class="filter-meta-right">
          <div class="view-toggle" role="tablist" aria-label="보기 방식">
            <button type="button" id="view-list" class="view-btn is-active" role="tab" aria-selected="true">목록</button>
            <button type="button" id="view-map" class="view-btn" role="tab" aria-selected="false">지도</button>
          </div>
          <button type="button" id="reset-filters" class="reset-btn" hidden>필터 초기화</button>
        </div>
      </div>
    </div>
  </section>

  <section class="weekend-recommend" id="weekend-recommend" hidden>
    <div class="container">
      <div class="weekend-header">
        <h2 class="weekend-title" id="weekend-title">이번 주말</h2>
        <a href="#" class="weekend-link" id="weekend-link">전체 보기 →</a>
      </div>
      <div class="weekend-row" id="weekend-cards"></div>
    </div>
  </section>

  <main class="main">
    <div class="container">
      <div id="cards" class="card-grid" aria-live="polite"></div>
      <div id="map" class="map-view" hidden></div>
      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-state-text">선택한 조건에 맞는 축제가 없습니다.</p>
        <button type="button" class="reset-btn" data-reset>필터 초기화</button>
      </div>
      <div id="error-state" class="error-state" hidden>
        <p>데이터를 불러오지 못했습니다. 새로고침해 주세요.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-line">
        <span>자료 © <a href="https://api.visitkorea.or.kr/" target="_blank" rel="noopener noreferrer">한국관광공사 TourAPI</a></span>
        <span aria-hidden="true">·</span>
        <span>지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a></span>
        <span aria-hidden="true">·</span>
        <span><a href="https://github.com/hhakimm/festivals-site" target="_blank" rel="noopener noreferrer">GitHub</a></span>
      </p>
      <p class="footer-note"><em>일정은 변동될 수 있으니 공식사이트에서 확인해 주세요.</em></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-modal-close aria-label="닫기">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
