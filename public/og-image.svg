  <text x="600" y="310" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="86" font-weight="800" text-anchor="middle" fill="#fff" letter-spacing="-3">한국, 너에게</text>
  <text x="600" y="408" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="86" font-weight="800" text-anchor="middle" fill="#facc15" letter-spacing="-3">어울리는 곳을 찾다</text>

  <!-- 서브 -->
  <text x="600" y="478" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#a3a3a3" letter-spacing="-0.5">13,000+ 큐레이션 · 여행 성향 테스트 · 4개 언어</text>

