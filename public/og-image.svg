<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="630" fill="#171717"/>
  <!-- 그라데이션 글로우 -->
  <radialGradient id="g" cx="0.85" cy="0.2" r="0.6">
    <stop offset="0" stop-color="#facc15" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- 브랜드 마크 (좌상단) — 산 + 해 -->
  <g transform="translate(60 60)">
    <rect width="84" height="84" rx="18" fill="#fff"/>
    <circle cx="60" cy="26" r="8" fill="#facc15"/>
    <path d="M10 68 L26 36 L40 54 L52 28 L74 68 Z" fill="#171717"/>
  </g>
  <text x="166" y="100" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#facc15" letter-spacing="-0.5">한국 가볼 만한 곳 · TravelKorea</text>

