  <text x="600" y="400" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#fff" letter-spacing="-2">여행 성향 테스트</text>
  <text x="600" y="450" text-anchor="middle" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-size="34" font-weight="500" fill="#facc15" letter-spacing="-1">Travel Personality Quiz · 旅行性向テスト</text>

