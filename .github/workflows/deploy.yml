name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매일 새벽 4시(KST 13시)에 TourAPI 최신 데이터로 리빌드
    - cron: '0 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # OG PNG 변환(resvg)에 필요한 한글(CJK) + 컬러 이모지 폰트
      - name: Install fonts for OG image rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Install dependencies
        run: npm ci

      - name: Fetch TourAPI data
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        # Secret 미설정·API 일시 장애에도 빌드는 계속 (기존 data JSON 사용).
        # 키 없으면 스크립트가 기존 데이터를 보존하고 종료(덮어쓰지 않음).
        continue-on-error: true
        run: npm run fetch:ci

      - name: Fetch i18n titles (en/ja/zh)
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        # 다국어 fetch는 시간이 길 수 있으니 best-effort
        continue-on-error: true
        timeout-minutes: 30
        run: npm run fetch:i18n:ci

      - name: Build site
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_DEFAULT: ${{ secrets.PUBLIC_ADSENSE_SLOT_DEFAULT }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          # 검색엔진 소유권 인증 — Secrets 설정 시에만 meta 출력 (미설정이면 무시)
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_NAVER_SITE_VERIFICATION: ${{ secrets.PUBLIC_NAVER_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.PUBLIC_BING_SITE_VERIFICATION }}
        run: npm run build:nofetch

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
